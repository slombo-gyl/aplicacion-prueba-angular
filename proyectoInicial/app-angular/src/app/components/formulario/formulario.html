<div class="card">
  <h2>
    {{ modo() === 'editar' ? 'Modificar Alumno' : 'Registrar Alumno' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="grid">
      <div class="field">
        <label for="nombre">Nombre</label>

        <input
          id="nombre"
          type="text"
          placeholder="Ingrese un nombre"
          formControlName="nombre"
        >

        @if (errors['nombre']) {
          <small>{{ errors['nombre'][0] }}</small>
        }
      </div>

      <div class="field">
        <label for="apellido">Apellido</label>

        <input
          id="apellido"
          type="text"
          placeholder="Ingrese un apellido"
          formControlName="apellido"
        >

        @if (errors['apellido']) {
          <small>{{ errors['apellido'][0] }}</small>
        }
      </div>

      <div class="field">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          placeholder="Ingrese un email"
          formControlName="email"
        >

        @if (errors['email']) {
          <small>{{ errors['email'][0] }}</small>
        }
      </div>

      <div class="field">
        <label for="dni">DNI</label>

        <input
          id="dni"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="8"
          placeholder="Ingrese un DNI"
          formControlName="dni"
        >

        @if (errors['dni']) {
          <small>{{ errors['dni'][0] }}</small>
        }
      </div>
    </div>

    <div class="buttons">
      <button class="destructive" type="button" (click)="onCerrar()">
        Cancelar
      </button>

      <button class="clear" type="reset">
        Limpiar Formulario
      </button>

      <button class="primary" type="submit">
        {{ modo() === 'editar' ? 'Modificar' : 'Registrar' }}
      </button>
    </div>
  </form>
</div>
