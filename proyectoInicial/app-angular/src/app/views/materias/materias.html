<div class="card">
    <div class="header">
        <button class="btn-back" (click)="navigateToHome()">
            <i class="pi pi-arrow-left"></i>
        </button>

        <h1 class="title">Materias</h1>

        <button class="btn-cargar-alumno" (click)="abrirFormulario()">
            Cargar Materia
        </button>
    </div>

    <p-table [value]="materias()" showGridlines [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>Nombre Materia</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template #body let-materia>
            <tr>
                <td>{{ materia.nombre }}</td>
                <td>
                    <div style="display: flex; gap: 0.5rem; justify-content: center;">
                        <button class="button" (click)="verDetalleMateria(materia)">
                            DETALLES
                        </button>
                        <button class="button" (click)="eliminarMateria(materia.id)">
                            ELIMINAR
                        </button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

@if (mostrarFormulario()) {
<div class="modal-overlay">
    <div (click)="$event.stopPropagation()">
        <app-formulario-agregar-materia (cerrar)="cerrarFormulario()"></app-formulario-agregar-materia>
    </div>
</div>
}

@if (mostrarDetalleMateria() && materiaSeleccionada()) {
<div class="modal-overlay">
    <div (click)="$event.stopPropagation()">
        <app-detalle-materia (cerrar)="cerrarDetalleMateria()" [materia]="materiaSeleccionada()!"></app-detalle-materia>
    </div>
</div>
}
