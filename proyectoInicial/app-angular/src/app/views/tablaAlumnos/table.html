<div class="container-main">
  <div class="card">
    <div class="header">
      <button class="btn-back" (click)="navigateToHome()">
        <i class="pi pi-arrow-left"></i>
      </button>
      <h1 class="title">Alumnos</h1>
    </div>
    <div class="action-container">
      <button class="btn-cargar-alumno" (click)="abrirFormulario()">Cargar Alumnos</button>
    </div>
    <div class="table-container">
      <p-table [value]="alumnos()" [paginator]="true" [rows]="5" [pageLinks]="3" [rowsPerPageOptions]="[5, 10, 20]" [scrollable]="true" responsiveLayout="scroll" scrollDirection="horizontal" styleClass="tabla-alumnos" showGridlines>
        <ng-template #header>
          <tr>
            <th>Nombre</th>
            <th>DNI</th>
            <th>Email</th>
            <th style="text-align: center;">Notas</th>
            <th>Acciones</th>
          </tr>
        </ng-template>
        <ng-template #body let-alumno>
          <tr>
            <td>{{ alumno.nombre }}</td>
            <td>{{ alumno.dni }}</td>
            <td>{{ alumno.email }}</td>
            <td><button class="button" (click)="abrirFormularioNota(alumno.id!)">Cargar notas</button></td>
            <td class="d-flex">
              <button (click)="verAlumno(alumno)">Detalles</button>
              <button (click)="cambiarEstado(alumno.id)">Cambiar estado</button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  @if (mostrarFormulario()) {
    <div class="modal-overlay" (click)="cerrarFormulario()">
      <div (click)="$event.stopPropagation()">
        <app-formulario (cerrar)="cerrarFormulario()" (alumnoGuardado)="callPage()"></app-formulario>
      </div>
    </div>
  }

  @if (mostrarFormularioNota() && alumnoSeleccionadoId() !== null) {
  <div class="modal-overlay" (click)="cerrarFormulario()">
    <div (click)="$event.stopPropagation()">
      <app-formulario-notas [alumnoId]="alumnoSeleccionadoId()!" (cerrar)="cerrarFormulario()"></app-formulario-notas>
    </div>
  }
</div>
